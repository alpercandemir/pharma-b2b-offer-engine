# Urun evreni. SPEC 2.1.
#
# UYARI (SPEC 8): asagidaki fiyat seviyeleri, marj kademeleri ve regulasyon
# olasiliklari DOGRULANMAMIS placeholder degerlerdir. POC'ta dogru olmalari
# gerekmiyor, degistirilebilir olmalari gerekiyor. Gercek degerler icin
# TITCK fiyat kararnamesi ve SGK Ek-4/A listesi teyit edilmeli.

evren:
  # Long tail: SKU hacim dagiliminin log-normal sigmasi. Buyudukce birkac SKU
  # hacmin cogunu alir, uzun kuyruk uzar.
  populerlik_log_sigma: 1.15
  koli_ici_adet_secenekleri: [1, 5, 10, 12, 20, 24, 30]
  koli_ici_adet_agirliklari: [0.10, 0.16, 0.26, 0.14, 0.16, 0.10, 0.08]
  birim_hacim_log_ort: -1.2      # ln(desimetrekup); medyan ~0.30 dm3
  birim_hacim_log_sigma: 0.55
  kdv_orani: 0.10                # ilacta indirimli KDV; domain sabiti degil, mevzuat -> knob
  its_olasiligi_rx: 0.98         # RX'te serilestirme neredeyse evrensel
  its_olasiligi_rx_disi: 0.15

# Depo ve eczane kar marji kademeleri. Ucuz ilacta yuksek yuzde, pahalida dusuk.
# psf_ust_siniri null = son kademe (ustu acik).
marj_kademeleri:
  - { psf_ust_siniri: 25.0,   depo_marji: 0.090, eczane_marji: 0.250 }
  - { psf_ust_siniri: 60.0,   depo_marji: 0.080, eczane_marji: 0.250 }
  - { psf_ust_siniri: 150.0,  depo_marji: 0.070, eczane_marji: 0.240 }
  - { psf_ust_siniri: 400.0,  depo_marji: 0.050, eczane_marji: 0.200 }
  - { psf_ust_siniri: null,   depo_marji: 0.030, eczane_marji: 0.160 }

# promosyon_serbest turetme kurali. SPEC 2.1 "genelde serbest" diyor; kural
# burada acik yazilir, kodda hardcode edilmez.
promosyon_serbest_kurali:
  recete_rengi_vetosu: [KIRMIZI, YESIL]        # bu renklerde her kosulda yasak
  urun_tipi_serbest: [OTC, TEG, DERMOKOZMETIK, MEDIKAL]
  rx_sgk_disi_serbest: true                    # RX ama geri odeme disi -> serbest
  rx_sgk_kapsaminda_serbest: false             # RX + SGK -> serbest degil

